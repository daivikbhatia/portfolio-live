<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Only prepend /portfolio-live if not already present
      var prefix = '/portfolio-live';
      var path = location.pathname;
      if (!path.startsWith(prefix)) {
        var redirectTo = prefix + path + location.search + location.hash;
        window.location.replace(redirectTo);
      }
      // If already on /portfolio-live, do nothing (let the 404 show)
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
    <p>If you are not redirected, <a id="redirect-link" href="#">click here</a>.</p>
    <script>
      var prefix = '/portfolio-live';
      var path = location.pathname;
      if (!path.startsWith(prefix)) {
        document.getElementById('redirect-link').href = prefix + path + location.search + location.hash;
      } else {
        document.getElementById('redirect-link').href = '/portfolio-live/';
      }
    </script>
  </body>
</html>
